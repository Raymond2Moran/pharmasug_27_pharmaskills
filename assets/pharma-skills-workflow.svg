<svg xmlns="http://www.w3.org/2000/svg" width="800" height="715" viewBox="0 0 800 715" role="img" aria-labelledby="title desc">
  <title id="title">SAS ADaM core dataset skills: ADSL first</title>
  <desc id="desc">Versioned SDTM and study rules feed ADSL development and QC, followed by BDS ADLB and ADVS and OCCDS ADAE and ADCM. Source SDTM also feeds both branches directly. Cross-dataset and independent checks lead to deliverables or a revision loop. SAS execution evidence is pending.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker>
    <marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker>
  </defs>
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; text-anchor: middle; fill: #1e293b; font-size: 12px; }
    .heading { font-size: 16px; font-weight: 600; }
    .strong { font-weight: 600; }
    .secondary { font-size: 10px; fill: #64748b; }
    .flow { fill: none; stroke: #64748b; stroke-width: 1.5; marker-end: url(#arrow); }
    .source { fill: none; stroke: #3b82f6; stroke-width: 1.5; marker-end: url(#arrow-blue); }
    .input { fill: #dbeafe; stroke: #3b82f6; }
    .process { fill: #fef3c7; stroke: #f59e0b; }
    .qc { fill: #f3e8ff; stroke: #a855f7; }
    .output { fill: #d1fae5; stroke: #22c55e; }
  </style>
  <rect width="800" height="715" fill="white"/>
  <text x="400" y="37" class="heading">SAS ADaM Core Dataset Skills</text>
  <text x="400" y="60" class="secondary">Specification-driven · ADSL first · Source traceability · Independent QC</text>

  <!-- Ordinary connectors: 5px source clearance, 11px to target boundary. -->
  <path class="flow" d="M400,139 L400,153"/>
  <path class="flow" d="M400,241 L400,255"/>
  <path class="flow" d="M230,343 L230,357"/>
  <path class="flow" d="M570,343 L570,357"/>
  <path class="flow" d="M230,463 L230,477"/>
  <path class="flow" d="M570,463 L570,477"/>
  <path class="flow" d="M400,565 L400,579"/>
  <!-- Source bypasses: SDTM supplies each target, in addition to ADSL. -->
  <path class="source" d="M80,107 C25,107 25,137 25,167 L25,353 C25,393 34,413 74,413"/>
  <path class="source" d="M720,107 C775,107 775,137 775,167 L775,353 C775,393 766,413 726,413"/>
  <text x="45" y="260" class="secondary" transform="rotate(-90 45 260)">Source SDTM: LB / VS</text>
  <text x="755" y="260" class="secondary" transform="rotate(90 755 260)">Source SDTM: AE / CM</text>

  <!-- Main column x=85..715; 30px vertical gaps. -->
  <rect x="85" y="80" width="630" height="54" rx="8" class="input"/>
  <text x="400" y="101" class="strong">Existing SDTM + protocol / SAP / dataset specification</text>
  <text x="400" y="119" class="secondary">DM · EX · DS · LB · VS · AE · CM + study metadata</text>

  <rect x="85" y="164" width="630" height="72" rx="8" class="qc"/>
  <text x="400" y="186" class="strong">Check versions and resolve study rules</text>
  <text x="400" y="204">Pin standards, population, treatment, baseline, visit and classification rules</text>
  <text x="400" y="222" class="secondary">Missing decisions → issue report and clarification before dependent derivations</text>

  <rect x="85" y="266" width="630" height="72" rx="8" class="process"/>
  <text x="400" y="288" class="strong">sas-adam-adsl · ADSL development + QC</text>
  <text x="400" y="306">One row per subject · planned / actual treatment · dates · populations · disposition</text>
  <text x="400" y="324" class="secondary">ADSL gate: keys, metadata and independent expected values checked before downstream use</text>

  <!-- Equal branches x=85..375 and x=425..715; center gap routes revision loop. -->
  <rect x="85" y="368" width="290" height="90" rx="8" class="process"/>
  <text x="230" y="390" class="strong">sas-adam-bds · ADLB / ADVS</text>
  <text x="230" y="408">LB / VS + checked ADSL</text>
  <text x="230" y="426">Parameters · baseline · visits · changes</text>
  <text x="230" y="444" class="secondary">ADLB ranges · dataset-specific QC</text>

  <rect x="425" y="368" width="290" height="90" rx="8" class="process"/>
  <text x="570" y="390" class="strong">sas-adam-occds · ADAE / ADCM</text>
  <text x="570" y="408">AE / CM + checked ADSL</text>
  <text x="570" y="426">Partial dates · TEAE · medication overlap</text>
  <text x="570" y="444" class="secondary">Preserved source records · dataset-specific QC</text>

  <rect x="85" y="488" width="630" height="72" rx="8" class="qc"/>
  <text x="400" y="510" class="strong">Cross-dataset checks + independent comparisons</text>
  <text x="400" y="528">Structure · metadata · derivation correctness · SAS log review</text>
  <text x="400" y="546" class="secondary">Check inherited ADSL values against the independent reference; reconcile discrepancies</text>

  <rect x="85" y="590" width="630" height="72" rx="8" class="output"/>
  <text x="400" y="612" class="strong">Reviewable delivery</text>
  <text x="400" y="630">SAS programs · metadata · source-to-target traceability · QC and issue reports</text>
  <text x="400" y="648" class="secondary">Datasets, logs and verified results only after documented SAS execution</text>

  <path d="M400,483 L400,349" fill="none" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-pink)"/>
  <text x="475" y="356" class="secondary" style="fill:#9d174d">Revise rules / code; rerun</text>
  <text x="400" y="690" class="secondary">Current delivery: skills + synthetic examples + static review. SAS runtime verification remains pending.</text>
</svg>
