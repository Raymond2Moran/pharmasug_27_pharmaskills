<svg xmlns="http://www.w3.org/2000/svg" width="700" height="661" viewBox="0 0 700 661" role="img" aria-labelledby="title desc">
<title id="title">Pharma Skills Development workflow</title>
<desc id="desc">Study inputs lead to milestone selection and versioned standards and specification review. Implementation and independent QC use the same resolved specification. Results are compared before evidence and limitations are reported. Discrepancies require revision and rerunning affected checks. This is a development workflow, not a validated production system.</desc>
<rect width="700" height="661" fill="#ffffff"/>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker>
</defs>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
<text x="350" y="37" text-anchor="middle" font-size="16" font-weight="600" fill="#1e293b">Pharma Skills Development</text>
<text x="350" y="60" text-anchor="middle" font-size="10" fill="#64748b">A reusable skill for building and evaluating pharma / CRO programming skills</text>

<path d="M350,139 L350,153" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M350,223 L350,237" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M180,325 L180,339" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M520,325 L520,339" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M180,445 L180,459" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M520,445 L520,459" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M350,529 L350,543" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<!-- Box bounds: x=25, y=80, right=675, bottom=134 -->
<rect x="25" y="80" width="650" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
<text x="350" y="102.2" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">Study context + source inputs</text>
<text x="350" y="120.2" text-anchor="middle" font-size="12" font-weight="400" fill="#1e40af">Data / metadata · protocol / SAP · specs / shells · sponsor conventions</text>
<!-- Box bounds: x=25, y=164, right=675, bottom=218 -->
<rect x="25" y="164" width="650" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
<text x="350" y="186.2" text-anchor="middle" font-size="12" font-weight="600" fill="#b45309">Select the next scoped milestone</text>
<text x="350" y="204.2" text-anchor="middle" font-size="12" font-weight="400" fill="#b45309">Inspect existing artifacts · define inputs, outputs, and acceptance evidence</text>
<!-- Box bounds: x=25, y=248, right=675, bottom=320 -->
<rect x="25" y="248" width="650" height="72" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
<text x="350" y="270.2" text-anchor="middle" font-size="12" font-weight="600" fill="#6b21a8">Retrieve standards + resolve specifications</text>
<text x="350" y="288.2" text-anchor="middle" font-size="12" font-weight="400" fill="#6b21a8">Pin CDISC model / IG / CT versions and cite sources</text>
<text x="350" y="306.2" text-anchor="middle" font-size="12" font-weight="400" fill="#6b21a8">Clarify missing analysis rules before dependent coding</text>
<!-- Box bounds: x=25, y=350, right=335, bottom=440 -->
<rect x="25" y="350" width="310" height="90" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
<text x="180" y="372.2" text-anchor="middle" font-size="12" font-weight="600" fill="#b45309">Build the selected component</text>
<text x="180" y="390.2" text-anchor="middle" font-size="12" font-weight="400" fill="#b45309">SDTM mappings · ADaM derivations</text>
<text x="180" y="408.2" text-anchor="middle" font-size="12" font-weight="400" fill="#b45309">TLF programs + rendered outputs</text>
<text x="180" y="426.2" text-anchor="middle" font-size="12" font-weight="400" fill="#b45309">Execute and retain traceability</text>
<!-- Box bounds: x=365, y=350, right=675, bottom=440 -->
<rect x="365" y="350" width="310" height="90" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
<text x="520" y="372.2" text-anchor="middle" font-size="12" font-weight="600" fill="#6b21a8">Construct independent QC</text>
<text x="520" y="390.2" text-anchor="middle" font-size="12" font-weight="400" fill="#6b21a8">Use the same resolved specification</text>
<text x="520" y="408.2" text-anchor="middle" font-size="12" font-weight="400" fill="#6b21a8">Derive expectations independently</text>
<text x="520" y="426.2" text-anchor="middle" font-size="12" font-weight="400" fill="#6b21a8">Keep benchmark truth separate</text>
<!-- Box bounds: x=25, y=470, right=675, bottom=524 -->
<rect x="25" y="470" width="650" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
<text x="350" y="492.2" text-anchor="middle" font-size="12" font-weight="600" fill="#6b21a8">Compare results + evaluate behavior</text>
<text x="350" y="510.2" text-anchor="middle" font-size="12" font-weight="400" fill="#6b21a8">Check counts, derivations, cells, layout, and seeded-error detection</text>
<!-- Box bounds: x=25, y=554, right=675, bottom=608 -->
<rect x="25" y="554" width="650" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
<text x="350" y="576.2" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">Report evidence + advance when criteria are met</text>
<text x="350" y="594.2" text-anchor="middle" font-size="12" font-weight="400" fill="#166534">Discrepancies: revise and rerun checks · retain limitations and open decisions</text>
<text x="350" y="636" text-anchor="middle" font-size="10" fill="#64748b">Initial MVP: synthetic DM / EX / AE → ADSL / ADAE → demographics + TEAE tables</text>
</svg>
